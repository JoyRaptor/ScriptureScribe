<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Violet &amp; Gold — built-in ScriptureScribe card skin</title>
<!-- Timing contract (milliseconds). The engine switches data-state from "in"
     to "hold" after ss-in-ms, and from "out" to "idle" after ss-out-ms. -->
<meta name="ss-in-ms"   content="1500">
<meta name="ss-out-ms"  content="850">
<meta name="ss-swap-ms" content="320">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Cinzel:wght@500;600&display=swap">
<style>
  :root {
    /* Book colour from the plugin (falls back to royal violet) */
    --acc:   var(--ss-accent, #8f7dff);
    --acc-l: var(--ss-accent-light, #ddd6ff);
    --gold:  #ecdcae;
    --ivory: #f7f1e6;
    --ease:  cubic-bezier(.22, .8, .24, 1);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }

  /* ── Stage: the whole card fades as one ─────────────────────────────── */
  .stage {
    position: fixed; inset: 0; overflow: hidden;
    opacity: 0;
    transition: opacity .6s cubic-bezier(.4, 0, .2, 1) .12s;
    background:
      radial-gradient(120% 85% at 50% -10%, #2c2070 0%, transparent 62%),
      radial-gradient(100% 80% at 50% 115%, #3b1b5e 0%, transparent 58%),
      linear-gradient(160deg, #0b0920 0%, #150f3a 52%, #09071d 100%);
  }
  html[data-state="in"] .stage, html[data-state="hold"] .stage {
    opacity: 1; transition: opacity .8s cubic-bezier(.3, 0, .2, 1);
  }
  html[data-state="idle"] *, html[data-state="idle"] *::before, html[data-state="idle"] *::after {
    animation-play-state: paused !important;
  }

  /* ── Living background (loops while the card is held) ───────────────── */
  .aurora {
    position: absolute; width: 85vmax; height: 85vmax; border-radius: 50%;
    filter: blur(70px); opacity: .55; mix-blend-mode: screen;
    background: radial-gradient(closest-side, rgba(143,125,255,.7), transparent);
    background: radial-gradient(closest-side, color-mix(in srgb, var(--acc) 72%, transparent), transparent);
  }
  .aurora.a1 { left: -30vmax; top: -45vmax; animation: drift1 26s ease-in-out infinite alternate; }
  .aurora.a2 {
    right: -35vmax; bottom: -50vmax; opacity: .38;
    background: radial-gradient(closest-side, rgba(200,90,200,.6), transparent);
    animation: drift2 32s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.18) rotate(25deg); } }
  @keyframes drift2 { to { transform: translate(-16vmax, -10vmax) scale(1.12) rotate(-20deg); } }

  .rays {
    position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax;
    margin: -110vmax 0 0 -110vmax; opacity: .22; mix-blend-mode: screen;
    background: repeating-conic-gradient(from 0deg, rgba(255,240,200,.0) 0deg, rgba(255,240,200,.16) 3deg, rgba(255,240,200,0) 9deg, rgba(255,240,200,0) 24deg);
    -webkit-mask-image: radial-gradient(closest-side, #000 10%, transparent 70%);
            mask-image: radial-gradient(closest-side, #000 10%, transparent 70%);
    animation: spin 160s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .motes { position: absolute; inset: 0; pointer-events: none; }
  .motes i {
    position: absolute; bottom: -12px; left: var(--x); width: var(--s); height: var(--s);
    border-radius: 50%; background: #fff6d8; opacity: 0;
    box-shadow: 0 0 calc(var(--s) * 3) rgba(255,236,170,.9);
    animation: rise var(--d) linear var(--dl) infinite;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0);                    opacity: 0; }
    12%  { opacity: var(--o); }
    85%  { opacity: var(--o); }
    100% { transform: translate(var(--dx), -112vh);       opacity: 0; }
  }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(4,3,16,.72) 100%);
  }

  /* ── Frame: draws outward from the centre line ──────────────────────── */
  .frame {
    position: absolute; inset: 4.6vh 3.2vw; box-sizing: border-box;
    border: 1px solid rgba(236,220,174,.5);
    clip-path: inset(0 50% 0 50%);
    transition: clip-path .55s cubic-bezier(.5, 0, .7, 0);
    box-shadow: inset 0 0 90px rgba(143,125,255,.14);
  }
  .frame.inner { inset: 6.6vh 4.7vw; border-color: rgba(236,220,174,.2); box-shadow: none; }
  html[data-state="in"] .frame, html[data-state="hold"] .frame {
    clip-path: inset(0 0 0 0);
    transition: clip-path 1.35s cubic-bezier(.65, 0, .2, 1) .3s;
  }
  html[data-state="in"] .frame.inner, html[data-state="hold"] .frame.inner { transition-delay: .5s; }
  .dia {
    position: absolute; width: 9px; height: 9px; background: var(--gold);
    transform: translate(-50%, -50%) rotate(45deg) scale(0); opacity: 0;
    box-shadow: 0 0 14px rgba(236,220,174,.8);
    transition: transform .3s ease, opacity .3s ease;
  }
  .dia.tl { left: 3.2vw;  top: 4.6vh; } .dia.tr { left: calc(100% - 3.2vw); top: 4.6vh; }
  .dia.bl { left: 3.2vw;  top: calc(100% - 4.6vh); } .dia.br { left: calc(100% - 3.2vw); top: calc(100% - 4.6vh); }
  html[data-state="in"] .dia, html[data-state="hold"] .dia {
    transform: translate(-50%, -50%) rotate(45deg) scale(1); opacity: 1;
    transition: transform .7s var(--ease) 1.45s, opacity .7s ease 1.45s;
  }

  /* ── Content ─────────────────────────────────────────────────────────── */
  .content {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    animation: breathe 14s ease-in-out infinite alternate;
  }
  @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.014); } }

  .orn {
    display: flex; align-items: center; gap: 1.1vw; margin-bottom: 3.2vh;
    opacity: 0; transform: scaleX(.3);
    transition: opacity .35s ease, transform .35s ease;
  }
  .orn span { display: block; width: 7vw; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .orn span:last-child { transform: scaleX(-1); }
  .orn b { width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 16px rgba(236,220,174,.9); }
  html[data-state="in"] .orn, html[data-state="hold"] .orn {
    opacity: 1; transform: none; transition: opacity 1s ease .55s, transform 1.1s var(--ease) .55s;
  }

  .quote {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -66%);
    font: 700 46vh/1 "Cormorant Garamond", Georgia, serif; color: var(--acc-l); opacity: 0;
    transition: opacity .4s ease; pointer-events: none; user-select: none;
  }
  html[data-state="in"] .quote, html[data-state="hold"] .quote { opacity: .07; transition: opacity 1.6s ease .5s; }

  [data-ss="text-box"] {
    position: relative; width: min(78vw, 1280px); height: 44vh;
    display: flex; align-items: center; justify-content: center;
  }
  [data-ss="text"] {
    width: 100%; font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-weight: 600; line-height: 1.26; color: var(--ivory);
    text-wrap: balance; text-shadow: 0 2px 34px rgba(143,125,255,.5), 0 1px 2px rgba(0,0,0,.5);
    transition: opacity .3s ease;
  }
  html[data-swapping] [data-ss="text"] { opacity: 0; }
  .w {
    display: inline-block; opacity: 0; transform: translateY(.42em); filter: blur(7px);
    transition: opacity .35s ease, transform .35s ease, filter .35s ease;
  }
  .w.pre { opacity: 0 !important; transform: translateY(.42em) !important; filter: blur(7px) !important; transition: none !important; }
  html[data-state="in"] .w, html[data-state="hold"] .w {
    opacity: 1; transform: none; filter: blur(0);
    transition: opacity .8s ease, transform .9s var(--ease), filter .8s ease;
    transition-delay: calc(var(--i) * var(--step, 40ms) + 650ms);
  }

  .ref {
    margin-top: 3.4vh; font: 600 clamp(14px, 2.6vh, 30px)/1 Cinzel, Georgia, serif;
    letter-spacing: .85em; text-transform: uppercase; padding-left: .85em; /* optically re-centre tracked caps */
    background: linear-gradient(100deg, var(--acc-l) 0%, var(--acc-l) 38%, #ffffff 50%, var(--acc-l) 62%, var(--acc-l) 100%);
    background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; transform: translateY(14px);
    transition: opacity .3s ease, transform .3s ease, letter-spacing .4s ease;
    animation: shimmer 8s ease-in-out infinite;
  }
  @keyframes shimmer { 0%, 55% { background-position: 100% 0; } 85%, 100% { background-position: 0 0; } }
  html[data-state="in"] .ref, html[data-state="hold"] .ref {
    opacity: 1; transform: none; letter-spacing: .42em; padding-left: .42em;
    transition: opacity 1s ease 1.25s, transform 1.1s var(--ease) 1.25s, letter-spacing 1.8s var(--ease) 1.25s, padding-left 1.8s var(--ease) 1.25s;
  }

  .ver {
    margin-top: 1.6vh; font: 500 clamp(10px, 1.6vh, 18px)/1 Cinzel, Georgia, serif;
    letter-spacing: .5em; padding-left: .5em; color: rgba(236,220,174,.55); opacity: 0;
    transition: opacity .3s ease;
  }
  html[data-state="in"] .ver, html[data-state="hold"] .ver { opacity: 1; transition: opacity 1.2s ease 1.7s; }
</style>
</head>
<body>
<div class="stage">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="rays"></div>
  <div class="motes"></div>
  <div class="vignette"></div>
  <div class="frame"></div><div class="frame inner"></div>
  <i class="dia tl"></i><i class="dia tr"></i><i class="dia bl"></i><i class="dia br"></i>

  <div class="content">
    <div class="orn"><span></span><b></b><span></span></div>
    <div class="quote">&ldquo;</div>
    <div data-ss="text-box"><div data-ss="text">&nbsp;</div></div>
    <div class="ref" data-ss="reference"></div>
    <div class="ver" data-ss="version"></div>
  </div>
</div>

<script>
(function () {
  // Drifting golden motes — randomised once, loop forever.
  var motes = document.querySelector(".motes");
  for (var i = 0; i < 36; i++) {
    var m = document.createElement("i");
    var s = (1.5 + Math.random() * 3.5).toFixed(1);
    m.style.cssText =
      "--x:" + (Math.random() * 100).toFixed(1) + "%;--s:" + s + "px;" +
      "--d:" + (16 + Math.random() * 18).toFixed(1) + "s;" +
      "--dl:-" + (Math.random() * 34).toFixed(1) + "s;" +
      "--o:" + (0.35 + Math.random() * 0.55).toFixed(2) + ";" +
      "--dx:" + ((Math.random() - 0.5) * 18).toFixed(1) + "vw";
    motes.appendChild(m);
  }

  // Warm the web fonts so the first verse never flashes a fallback face.
  if (document.fonts && document.fonts.load) {
    document.fonts.load('600 40px "Cormorant Garamond"');
    document.fonts.load('600 20px "Cinzel"');
  }

  // Split the verse into words so they can rise in one after another.
  window.addEventListener("ss:content", function () {
    var el = document.querySelector('[data-ss="text"]');
    if (!el) return;
    var words = (el.textContent || "").split(/\s+/).filter(Boolean);
    el.textContent = "";
    el.style.setProperty("--step", Math.min(55, 1100 / Math.max(words.length, 1)).toFixed(1) + "ms");
    words.forEach(function (w, idx) {
      var span = document.createElement("span");
      span.className = "w pre";
      span.style.setProperty("--i", idx);
      span.textContent = w;
      el.appendChild(span);
      if (idx < words.length - 1) el.appendChild(document.createTextNode(" "));
    });
    // Reveal on the next frames so the rise transition runs even when swapping verses mid-hold.
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      el.querySelectorAll(".w.pre").forEach(function (s) { s.classList.remove("pre"); });
    }); });
  });
})();
</script>
</body>
</html>
